name: Deploy to VPS

on:
  push:
    branches: [master]
  workflow_dispatch:        # permite lanzarlo a mano desde la pestaña Actions

concurrency:
  group: deploy-produccion
  cancel-in-progress: true  # si haces dos push seguidos, solo sale el último

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm i

      - name: Compilar
        run: npm run build

      - name: Configurar la llave SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Publicar en el servidor
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes" \
            dist/ \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.DEPLOY_PATH }}/"

      # ── OJO: cambia "dist/" arriba por la carpeta que genere tu framework ──
      #   Astro, Vite, Vue        →  dist/
      #   Next.js (output export) →  out/
      #   Create React App        →  build/
      #   SvelteKit (adapter-static) → build/
      #   La barra final es obligatoria: copia el CONTENIDO, no la carpeta.